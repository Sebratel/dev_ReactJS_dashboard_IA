    <!-- Aplica o tema salvo ANTES do CSS pintar qualquer coisa — sem isso,
         quem já escolheu "escuro" veria um flash claro no primeiro paint
         (o CSS aplica o :root padrão antes do JS do app rodar). Lê a mesma
         chave que o zustand persist usa (src/store/appStore.ts), mas direto
         do localStorage — não pode esperar o bundle do React carregar. -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('indicadores-sebratel-app')
          var theme = raw && JSON.parse(raw).state && JSON.parse(raw).state.theme
          if (theme === 'dark') document.documentElement.dataset.theme = 'dark'
        } catch (e) { /* localStorage indisponível ou JSON inválido — fica no padrão claro */ }
      })()
    </script>
