# Indicadores Sebratel — stack de produção (SPA estática via nginx + API + ETL).
#
# Pensada para rodar como STACK DO PORTAINER apontada para este repositório do
# GitHub (Stacks → Add stack → Repository). Ver DEPLOY-PORTAINER.md para o
# passo a passo e a lista de variáveis a preencher na tela da stack.
#
# Duas decisões que fazem a stack funcionar no Portainer sem retoque manual:
#   1. Nenhum `container_name` fixo — o Portainer prefixa os containers com o
#      nome da stack. Nome fixo colide entre stacks (ex. uma de homologação e
#      uma de produção no mesmo host) e atrapalha o redeploy.
#   2. Nenhuma credencial do Google no build nem no serviço `frontend`: o login é
#      conduzido pelo servidor (fluxo de código de autorização), então o Client
#      ID e o Client Secret ficam só no `backend`, lidos do ambiente em runtime.
#      A imagem do `frontend` é a mesma em qualquer ambiente.
name: dev_reactjs_dashboard_ia

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      # Configuração do Firebase para o BUILD do bundle. Não é `environment`:
      # o Vite grava esses valores dentro do JavaScript na hora de compilar, e
      # variável de runtime chegaria tarde demais. Consequência prática no
      # Portainer: mudar qualquer uma delas exige **redeploy com rebuild** —
      # recriar o container sozinho não muda nada.
      args:
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID}
    image: indicadores-sebratel-web:latest
    pull_policy: build
    restart: unless-stopped
    networks:
      - indicadores-sebratel
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # `:?` em vez de um valor vazio: sem WEB_PORT, o Docker publicava numa
      # porta ALEATÓRIA — a stack subia "saudável" e ficava inacessível no
      # endereço esperado, com só um aviso perdido no log do deploy. Agora o
      # deploy para, dizendo o que falta.
      - "${WEB_PORT:?defina WEB_PORT na stack (ex.: 8081) — sem isso o Docker publica numa porta aleatoria}:80"
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256m

  backend:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: indicadores-sebratel-api:latest
    pull_policy: build
    restart: unless-stopped
    networks:
      - indicadores-sebratel
    environment:
      API_PORT: 8788
      ALLOWED_DOMAIN: ${ALLOWED_DOMAIN:-sebratel.com.br}
      # Arquivo que a API LÊ. O `scheduler` grava o mesmo arquivo, sob o nome
      # SNAPSHOT_OUT. Aqui não é preciso declarar SNAPSHOT_OUT: quando a API
      # dispara o ETL sozinha (ao cadastrar/editar uma fonte), o script usa
      # este valor como destino — ver o comentário em scripts/fetch-install.mjs.
      # Declarar os dois com valores diferentes quebra a atualização em segundo
      # plano em silêncio: a fonte nova nunca chega no Builder.
      SNAPSHOT_PATH: /snapshot/installData.data
      # Administradores iniciais, separados por vírgula — ver
      # server/accessLog.mjs. Só valem enquanto não há nenhum admin salvo em
      # data/users.json; sem isto, valem os e-mails embutidos no código.
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      # SSO: Firebase Authentication. É contra ESTE id que o `aud` e o `iss` do
      # ID token são conferidos (server/firebaseToken.mjs) — sem ele, o login
      # devolve 503 dizendo o que falta; com um id errado, token de outro
      # projeto Firebase entraria. Obrigatório.
      #
      # Não há mais client secret nem redirect_uri: o fluxo de código de
      # autorização foi aposentado em 13/09/2026. O que o navegador precisa
      # (VITE_FIREBASE_*) vai no BUILD do serviço `frontend`, acima.
      FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
      # Tempo de vida da sessão de login, em dias.
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
      # Chave de cifra dos segredos guardados em disco: tokens do Data Hub e os
      # tokens do Google das sessões de login. Se ficar vazia, uma chave
      # aleatória é gerada em data/.secret-key no volume compartilhado —
      # funciona, mas definir aqui dá controle sobre rotação. DEVE ser igual à
      # do serviço `scheduler`, senão o ETL não decifra os tokens do Data Hub.
      # Trocá-la desloga todo mundo (as sessões viram ilegíveis).
      SECRETS_KEY: ${SECRETS_KEY:-}
      # Não há credencial de banco aqui de propósito: este serviço não fala com
      # Postgres nem MariaDB. Todo dado corporativo entra pelo Data Hub.
      # Endereço padrão sugerido no cadastro de uma fonte do Data Hub.
      DHUB_BASE_URL: ${DHUB_BASE_URL:-https://data-hub.sebratel.net.br}
      # Leitura direta (fontes em "Direto no Data Hub"): cada widget é uma
      # consulta no Data Hub. Cache do resultado, consultas simultâneas e tempo
      # limite — os padrões casam com o motor de lá (6 vagas, 30 s).
      DHUB_QUERY_CACHE_SECONDS: ${DHUB_QUERY_CACHE_SECONDS:-60}
      DHUB_QUERY_CONCURRENCY: ${DHUB_QUERY_CONCURRENCY:-6}
      DHUB_QUERY_TIMEOUT_MS: ${DHUB_QUERY_TIMEOUT_MS:-45000}
      # Teto de uma fonte em CÓPIA LOCAL (o ETL disparado pela tela roda aqui).
      DHUB_COPY_MAX_MB: ${DHUB_COPY_MAX_MB:-100}
      # Bloqueio de edição por guia (server/tabLocks.mjs): prazo, em segundos,
      # para o bloqueio de quem fechou a tela vencer sozinho. Fica em memória —
      # a API roda numa instância só (a memória da IA já exige isso).
      TAB_LOCK_TTL_SECONDS: ${TAB_LOCK_TTL_SECONDS:-120}
      # Montagem com IA. Sem ANTHROPIC_API_KEY o botão "IA" avisa que está
      # indisponível e o resto do app segue normal. Só o `backend` precisa — o
      # navegador nunca vê a chave.
      # A IA NÃO se configura por ambiente. Provedor, credencial, modelo,
      # esforço, tetos, orçamento e preço vivem em "Configurações › Provedor de
      # IA" e são guardados cifrados em data/aiConfig.json — no volume `data`
      # abaixo, que é o que faz a configuração sobreviver a um redeploy da
      # stack. Numa instalação nova a IA sobe NÃO CONFIGURADA, e um
      # administrador cadastra o provedor na tela.
      # Fuso — o mesmo do Dockerfile, repetido aqui pra ficar visível na tela da
      # stack no Portainer (é lá que alguém vai procurar).
      TZ: ${TZ:-America/Sao_Paulo}
      # Teto de heap do Node. O processo carrega o snapshot inteiro em memória
      # (ver server/dataset.mjs), então sem teto um dataset grande derruba o
      # container por OOM do host em vez de falhar só a consulta.
      NODE_OPTIONS: ${API_NODE_OPTIONS:---max-old-space-size=1024}
    # Log limitado: sem isto o json-file cresce até encher o disco do host, e
    # este serviço registra uma linha por ida ao modelo. Mesmo ajuste do
    # comercial_pbi.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1.5g
    volumes:
      # Leitura E escrita: além de ler o snapshot, a API dispara o ETL em
      # segundo plano quando alguém mexe no catálogo de fontes (ver
      # triggerEtlRefresh em server/index.mjs) — e é o ETL que escreve aqui.
      - snapshot:/snapshot
      - data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8788/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  # Job do ETL — materializa os datasets do Data Hub num ciclo curto, gravando
  # no volume `snapshot`. O ritmo real de CADA fonte é configurado na tela
  # (tempo real / agendada); este intervalo é só o ciclo base.
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: indicadores-sebratel-api:latest
    pull_policy: build
    restart: unless-stopped
    networks:
      - indicadores-sebratel
    command: ["node", "scripts/etl-scheduler.mjs"]
    # O agendador não abre porta, então o HEALTHCHECK herdado da imagem (:8788/api/health)
    # o deixaria `unhealthy` para sempre — e `up --wait` do CI (e o Portainer) reprovariam a stack.
    # Saudável aqui = o processo do agendador está vivo.
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f etl-scheduler >/dev/null || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    environment:
      SNAPSHOT_OUT: /snapshot/installData.data
      # Nome que o scheduler realmente lê (scripts/etl-scheduler.mjs).
      ETL_BASE_INTERVAL_MINUTES: ${ETL_BASE_INTERVAL_MINUTES:-2}
      ETL_RUN_ON_START: ${ETL_RUN_ON_START:-false}
      # Precisa ser IGUAL à do serviço `backend` — é com ela que os tokens do Data
      # Hub cadastrados pela tela são decifrados aqui.
      SECRETS_KEY: ${SECRETS_KEY:-}
      # Ajustes de paginação/teto da busca no Data Hub — os padrões do código
      # servem bem, só mexa se um dataset específico exigir.
      DHUB_PAGE_SIZE: ${DHUB_PAGE_SIZE:-10000}
      DHUB_MAX_ROWS: ${DHUB_MAX_ROWS:-500000}
      DHUB_TIMEOUT_MS: ${DHUB_TIMEOUT_MS:-120000}
      # Teto de uma fonte em CÓPIA LOCAL, em MB de JSON — acima disso ela vira
      # erro nela mesma (com a sugestão de leitura direta) em vez de derrubar o
      # ciclo. A api carrega o snapshot inteiro: 100 MB já pesam ~300 MB lá.
      DHUB_COPY_MAX_MB: ${DHUB_COPY_MAX_MB:-100}
      TZ: ${TZ:-America/Sao_Paulo}
      # Teto maior que o da api: é este processo que materializa os datasets,
      # montando o snapshot inteiro em memória antes de gravar.
      NODE_OPTIONS: ${ETL_NODE_OPTIONS:---max-old-space-size=2048}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 2.5g
    volumes:
      - snapshot:/snapshot
      - data:/app/data

networks:
  indicadores-sebratel:
    driver: bridge

volumes:
  snapshot:
  # Fontes do Data Hub (data/lakehouseSources.json), planilhas, workspace,
  # sessões de login (data/sessions.json) e a chave de cifra
  # (data/.secret-key) — precisa ser o MESMO volume nos serviços api e etl.
  # Com volumes separados, o etl não vê as fontes cadastradas pela tela (grava
  # um snapshot vazio) e os tokens do Data Hub ficam indecifráveis do lado dele.
  data:
