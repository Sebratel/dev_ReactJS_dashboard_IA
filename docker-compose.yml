# Indicadores Sebratel — stack de produção (SPA estática via nginx + API + ETL).
#
# Pensada para rodar como STACK DO PORTAINER apontada para este repositório do
# GitHub (Stacks → Add stack → Repository). Ver DEPLOY-PORTAINER.md para o
# passo a passo e a lista de variáveis a preencher na tela da stack.
#
# Duas decisões que fazem a stack funcionar no Portainer sem retoque manual:
#   1. Nenhum `container_name` fixo — o Portainer prefixa os containers com o
#      nome da stack. Nome fixo colide entre stacks (ex. uma de homologação e
#      uma de produção no mesmo host) e atrapalha o redeploy.
#   2. Nenhuma credencial do Google no build nem no serviço `web`: o login é
#      conduzido pelo servidor (fluxo de código de autorização), então o Client
#      ID e o Client Secret ficam só no `api`, lidos do ambiente em runtime.
#      A imagem do `web` é a mesma em qualquer ambiente.
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: indicadores-sebratel-web:latest
    pull_policy: build
    restart: unless-stopped
    networks:
      - indicadores-sebratel
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT}:80"
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256m

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: indicadores-sebratel-api:latest
    pull_policy: build
    restart: unless-stopped
    networks:
      - indicadores-sebratel
    environment:
      API_PORT: 8788
      ALLOWED_DOMAIN: ${ALLOWED_DOMAIN:-sebratel.com.br}
      SNAPSHOT_PATH: /snapshot/installData.data
      # Quem é administrador (lista fixa, separada por vírgula) — ver
      # server/accessLog.mjs. Sem isto, valem só os e-mails embutidos no código.
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      # SSO do Google — fluxo de código de autorização conduzido aqui, no
      # servidor. Os dois são obrigatórios: sem o secret não há troca de token,
      # e o login falha com mensagem clara na tela.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Endereço público da aplicação, usado para montar o `redirect_uri` que o
      # Google exige que seja IDÊNTICO ao cadastrado no Google Cloud (ex.
      # http://indicadores.interno:8081). Deixando vazio, é derivado dos
      # cabeçalhos da requisição — funciona, mas depender do proxy é mais
      # frágil do que declarar. Ver DEPLOY-PORTAINER.md, seção SSO.
      APP_BASE_URL: ${APP_BASE_URL:-}
      # Tempo de vida da sessão de login, em dias.
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
      # Chave de cifra dos segredos guardados em disco: tokens do Data Hub e os
      # tokens do Google das sessões de login. Se ficar vazia, uma chave
      # aleatória é gerada em data/.secret-key no volume compartilhado —
      # funciona, mas definir aqui dá controle sobre rotação. DEVE ser igual à
      # do serviço `etl`, senão o ETL não decifra os tokens do Data Hub.
      # Trocá-la desloga todo mundo (as sessões viram ilegíveis).
      SECRETS_KEY: ${SECRETS_KEY:-}
      # Não há credencial de banco aqui de propósito: este serviço não fala com
      # Postgres nem MariaDB. Todo dado corporativo entra pelo Data Hub.
      # Endereço padrão sugerido no cadastro de uma fonte do Data Hub.
      DHUB_BASE_URL: ${DHUB_BASE_URL:-https://data-hub.sebratel.net.br}
      # Montagem com IA. Sem ANTHROPIC_API_KEY o botão "IA" avisa que está
      # indisponível e o resto do app segue normal. Só o `api` precisa — o
      # navegador nunca vê a chave.
      # NOTA: desde a tela "Configurações › Provedor de IA", tudo abaixo é só
      # SEMENTE — vale enquanto não existir data/aiConfig.json no volume. A
      # partir da primeira gravação pela tela, a configuração salva manda, e
      # mexer aqui não tem efeito. Numa instalação nova, preencher aqui evita
      # ter que abrir a tela pra IA começar a funcionar.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-claude-opus-5}
      AI_EFFORT: ${AI_EFFORT:-high}
      AI_DAILY_BUDGET_USD: ${AI_DAILY_BUDGET_USD:-5}
      # Fuso — o mesmo do Dockerfile, repetido aqui pra ficar visível na tela da
      # stack no Portainer (é lá que alguém vai procurar).
      TZ: ${TZ:-America/Sao_Paulo}
      # Teto de heap do Node. O processo carrega o snapshot inteiro em memória
      # (ver server/dataset.mjs), então sem teto um dataset grande derruba o
      # container por OOM do host em vez de falhar só a consulta.
      NODE_OPTIONS: ${API_NODE_OPTIONS:---max-old-space-size=1024}
    # Log limitado: sem isto o json-file cresce até encher o disco do host, e
    # este serviço registra uma linha por ida ao modelo. Mesmo ajuste do
    # comercial_pbi.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1.5g
    volumes:
      # Leitura E escrita: além de ler o snapshot, a API dispara o ETL em
      # segundo plano quando alguém mexe no catálogo de fontes (ver
      # triggerEtlRefresh em server/index.mjs) — e é o ETL que escreve aqui.
      - snapshot:/snapshot
      - data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8788/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  # Job do ETL — materializa os datasets do Data Hub num ciclo curto, gravando
  # no volume `snapshot`. O ritmo real de CADA fonte é configurado na tela
  # (tempo real / agendada); este intervalo é só o ciclo base.
  etl:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: indicadores-sebratel-api:latest
    pull_policy: build
    restart: unless-stopped
    networks:
      - indicadores-sebratel
    command: ["node", "scripts/etl-scheduler.mjs"]
    environment:
      SNAPSHOT_OUT: /snapshot/installData.data
      # Nome que o scheduler realmente lê (scripts/etl-scheduler.mjs).
      ETL_BASE_INTERVAL_MINUTES: ${ETL_BASE_INTERVAL_MINUTES:-2}
      ETL_RUN_ON_START: ${ETL_RUN_ON_START:-false}
      # Precisa ser IGUAL à do serviço `api` — é com ela que os tokens do Data
      # Hub cadastrados pela tela são decifrados aqui.
      SECRETS_KEY: ${SECRETS_KEY:-}
      # Ajustes de paginação/teto da busca no Data Hub — os padrões do código
      # servem bem, só mexa se um dataset específico exigir.
      DHUB_PAGE_SIZE: ${DHUB_PAGE_SIZE:-10000}
      DHUB_MAX_ROWS: ${DHUB_MAX_ROWS:-500000}
      DHUB_TIMEOUT_MS: ${DHUB_TIMEOUT_MS:-120000}
      TZ: ${TZ:-America/Sao_Paulo}
      # Teto maior que o da api: é este processo que materializa os datasets,
      # montando o snapshot inteiro em memória antes de gravar.
      NODE_OPTIONS: ${ETL_NODE_OPTIONS:---max-old-space-size=2048}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 2.5g
    volumes:
      - snapshot:/snapshot
      - data:/app/data

networks:
  indicadores-sebratel:
    driver: bridge

volumes:
  snapshot:
  # Fontes do Data Hub (data/lakehouseSources.json), planilhas, workspace,
  # sessões de login (data/sessions.json) e a chave de cifra
  # (data/.secret-key) — precisa ser o MESMO volume nos serviços api e etl.
  # Com volumes separados, o etl não vê as fontes cadastradas pela tela (grava
  # um snapshot vazio) e os tokens do Data Hub ficam indecifráveis do lado dele.
  data:
