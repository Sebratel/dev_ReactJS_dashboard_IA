server {
    listen       80;
    server_name  _;
    server_tokens off;

    # Cabeçalhos de segurança. add_header NÃO é herdado por um location que declara o
    # seu próprio add_header (caso de /assets/ e /index.html abaixo): por isso
    # aparecem repetidos lá.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    root   /usr/share/nginx/html;
    index  index.html;

    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location /api/ {
        client_max_body_size 12m;

        # Resolução do upstream DIFERIDA para o momento da requisição.
        #
        # Com `proxy_pass http://backend:8788` (host literal), o nginx resolve o
        # nome no START e se recusa a subir se o container `backend` ainda não
        # existe ("host not found in upstream") — além de guardar o IP para
        # sempre, o que quebra quando o `backend` é recriado (todo redeploy da
        # stack no Portainer recria os containers). Usando uma VARIÁVEL, a
        # resolução passa a ser por requisição, via DNS interno do Docker
        # (127.0.0.11), e o `frontend` sobe e se recupera sozinho.
        #
        # Com variável em proxy_pass o nginx não repassa a URI automaticamente,
        # daí o $request_uri explícito (que já inclui a query string).
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream backend:8788;
        proxy_pass http://$api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
